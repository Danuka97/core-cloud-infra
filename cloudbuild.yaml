steps:
  # Retrieve the list of changed directories comparing against previous commit or PR target branch
  # This relies on Cloud Build cloning the repo securely and git history being available.
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
    - '-c'
    - |
      # If this is a PR, compare against base branch; if it's a push, compare against previous commit
      if [ -n "$_HEAD_BRANCH" ]; then
        git fetch origin $_BASE_BRANCH --depth=1
        DIFF_TARGET="origin/$_BASE_BRANCH"
      else
        # Cloud Build's automatic source checkout is a shallow (depth=1) clone
        # of just $COMMIT_SHA, so its parent doesn't exist locally yet and
        # "$COMMIT_SHA~1" can't be used as a remote refspec for fetch. Fetch
        # $COMMIT_SHA again with depth=2 to pull down its parent too.
        git fetch origin $COMMIT_SHA --depth=2
        if git rev-parse -q --verify "$COMMIT_SHA~1" >/dev/null 2>&1; then
          DIFF_TARGET="$COMMIT_SHA~1"
        else
          # No parent (e.g. very first commit) - diff against the empty tree
          # so every file counts as changed.
          DIFF_TARGET=$$(git hash-object -t tree /dev/null)
        fi
      fi

      echo "Looking for changes against $$DIFF_TARGET..."

      CHANGED_FILES=$$(git diff --name-only $$DIFF_TARGET $COMMIT_SHA)

      # Any application-specific file changed (main.tf, variables.tf, tfvars, etc.)
      # re-plans/applies EVERY environment of that application, not just the one
      # environment whose file changed - keeps dev/uat/prod consistent.
      CHANGED_APPS=$$(echo "$$CHANGED_FILES" | grep -E "^applications/[^/]+/" | cut -d/ -f2 | sort -u)

      # A change to a shared module affects every application/environment that
      # consumes it, so fall back to targeting everything under applications/.
      MODULES_CHANGED=$$(echo "$$CHANGED_FILES" | grep -c "^modules/" || true)

      > /workspace/changed_dirs.txt

      if [ "$$MODULES_CHANGED" -gt 0 ]; then
        echo "Shared module changes detected - targeting all application environments."
        find applications -mindepth 2 -maxdepth 2 -type d >> /workspace/changed_dirs.txt
      else
        for app in $$CHANGED_APPS; do
          if [ -d "applications/$$app" ]; then
            find "applications/$$app" -mindepth 1 -maxdepth 1 -type d >> /workspace/changed_dirs.txt
          fi
        done
      fi

      sort -u -o /workspace/changed_dirs.txt /workspace/changed_dirs.txt

      echo "Directories to process:"
      cat /workspace/changed_dirs.txt

  # Initialize Terraform in all changed directories
  - name: 'hashicorp/terraform:latest'
    entrypoint: 'sh'
    args: 
    - '-c'
    - |
      if [ ! -s /workspace/changed_dirs.txt ]; then
        echo "No application changes detected."
        exit 0
      fi

      while IFS= read -r dir; do
        if [ -d "$dir" ]; then
          echo "Initializing Terraform in $dir..."
          cd /workspace/"$dir"
          terraform init
        fi
      done < /workspace/changed_dirs.txt
    id: 'tf-init'

  # Terraform Plan (Runs for changed directories)
  - name: 'hashicorp/terraform:latest'
    entrypoint: 'sh'
    args: 
    - '-c'
    - |
      if [ "$_ACTION" = "plan" ] || [ "$_ACTION" = "apply" ]; then
        while IFS= read -r dir; do
          if [ -d "$dir" ]; then
            echo "Planning Terraform in $dir..."
            cd /workspace/"$dir"
            terraform plan -out=tfplan
          fi
        done < /workspace/changed_dirs.txt
      fi
    id: 'tf-plan'
    waitFor: ['tf-init']

  # Terraform Apply (Only runs if _ACTION=apply)
  - name: 'hashicorp/terraform:latest'
    entrypoint: 'sh'
    args: 
    - '-c'
    - |
      if [ "$_ACTION" = "apply" ]; then
        while IFS= read -r dir; do
          if [ -d "$dir" ]; then
            echo "Applying Terraform in $dir..."
            cd /workspace/"$dir"
            if [ -f "tfplan" ]; then
              terraform apply -auto-approve tfplan
            else
              echo "Error: tfplan missing in $dir"
              exit 1
            fi
          fi
        done < /workspace/changed_dirs.txt
      else
        echo "Action is not apply, skipping terraform apply."
      fi
    id: 'tf-apply'
    waitFor: ['tf-plan']

substitutions:
  _ACTION: "plan"      # Defaults to plan, overridden to 'apply' in push-to-main trigger
  _BASE_BRANCH: ""     # Used for PRs
  _HEAD_BRANCH: ""     # Used for PRs

options:
  logging: CLOUD_LOGGING_ONLY