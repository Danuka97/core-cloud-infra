steps:
  # Read the marker recording the last commit this pipeline successfully
  # applied (written by the record-marker step below). Uses the dedicated
  # gsutil builder image rather than assuming gsutil exists inside the git
  # image. Writes an empty file if no marker exists yet (first run ever).
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'sh'
    args:
    - '-c'
    - |
      gsutil cat "gs://$_STATE_BUCKET/ci/last-applied-commit.txt" > /workspace/last_applied_commit.txt 2>/dev/null || true
    id: 'read-marker'

  # Retrieve the list of changed directories comparing against previous commit or PR target branch
  # This relies on Cloud Build cloning the repo securely and git history being available.
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    waitFor: ['read-marker']
    args:
    - '-c'
    - |
      # If this is a PR, compare against base branch; if it's a push, compare
      # against the last commit this pipeline actually finished processing -
      # NOT just the immediate parent (~1). If two PRs merge to main in quick
      # succession, GitHub may only fire one push build for the latest HEAD,
      # and diffing against ~1 alone would silently skip whatever the earlier,
      # un-built merge commit introduced. A marker file in the state bucket
      # tracks the true "last processed" commit across build runs, so no
      # range of pushed commits is ever skipped, however many land at once.
      if [ -n "$_HEAD_BRANCH" ]; then
        git fetch origin $_BASE_BRANCH --depth=1
        DIFF_TARGET="origin/$_BASE_BRANCH"
      else
        LAST_COMMIT=$$(cat /workspace/last_applied_commit.txt 2>/dev/null || true)

        if [ -n "$$LAST_COMMIT" ]; then
          # Fetch enough history to reach the last commit we actually
          # processed, however far back that was.
          git fetch origin "$$LAST_COMMIT" --depth=1 2>/dev/null || git fetch origin --unshallow
          if git rev-parse -q --verify "$$LAST_COMMIT" >/dev/null 2>&1; then
            DIFF_TARGET="$$LAST_COMMIT"
          fi
        fi

        if [ -z "$$DIFF_TARGET" ]; then
          # No marker yet (first run ever) - fall back to the immediate
          # parent, same as before, or the empty tree on the very first commit.
          git fetch origin $COMMIT_SHA --depth=2
          if git rev-parse -q --verify "$COMMIT_SHA~1" >/dev/null 2>&1; then
            DIFF_TARGET="$COMMIT_SHA~1"
          else
            DIFF_TARGET=$$(git hash-object -t tree /dev/null)
          fi
        fi
      fi

      echo "Looking for changes against $$DIFF_TARGET..."

      CHANGED_FILES=$$(git diff --name-only $$DIFF_TARGET $COMMIT_SHA)

      # Any application-specific file changed (main.tf, variables.tf, tfvars, etc.)
      # re-plans/applies EVERY environment of that application, not just the one
      # environment whose file changed - keeps dev/uat/prod consistent.
      CHANGED_APPS=$$(echo "$$CHANGED_FILES" | grep -E "^applications/[^/]+/" | cut -d/ -f2 | sort -u)

      # A change to a shared module affects every application/environment that
      # consumes it, so fall back to targeting everything under applications/.
      MODULES_CHANGED=$$(echo "$$CHANGED_FILES" | grep -c "^modules/" || true)

      > /workspace/changed_dirs.txt

      if [ "$$MODULES_CHANGED" -gt 0 ]; then
        echo "Shared module changes detected - targeting all application environments."
        find applications -mindepth 2 -maxdepth 2 -type d >> /workspace/changed_dirs.txt
      else
        for app in $$CHANGED_APPS; do
          if [ -d "applications/$$app" ]; then
            find "applications/$$app" -mindepth 1 -maxdepth 1 -type d >> /workspace/changed_dirs.txt
          fi
        done
      fi

      sort -u -o /workspace/changed_dirs.txt /workspace/changed_dirs.txt

      echo "Directories to process:"
      cat /workspace/changed_dirs.txt
    id: 'detect-changes'

  # Initialize Terraform in all changed directories
  - name: 'hashicorp/terraform:latest'
    entrypoint: 'sh'
    args: 
    - '-c'
    - |
      if [ ! -s /workspace/changed_dirs.txt ]; then
        echo "No application changes detected."
        exit 0
      fi

      # Use a for-loop over command substitution (not "while read ... done <
      # file") so terraform can never interfere with how directories are
      # iterated - a while-read loop shares its stdin fd with every command
      # run inside it, and some shells let subprocesses (like terraform)
      # consume/exhaust that fd, silently stopping the loop after one entry.
      for dir in $(cat /workspace/changed_dirs.txt); do
        if [ -d "$dir" ]; then
          echo "Initializing Terraform in $dir..."
          cd /workspace/"$dir"
          terraform init -input=false
          cd /workspace
        fi
      done
    id: 'tf-init'
    waitFor: ['detect-changes']

  # Security static analysis (Runs for changed directories, before plan)
  # Checkov scans the Terraform source itself for policy violations (open
  # firewalls, missing encryption, public buckets, over-broad IAM, etc.)
  # without needing GCP credentials, so an insecure change fails fast
  # instead of waiting on a full plan.
  - name: 'bridgecrew/checkov:latest'
    entrypoint: 'sh'
    args:
    - '-c'
    - |
      if [ ! -s /workspace/changed_dirs.txt ]; then
        exit 0
      fi

      for dir in $(cat /workspace/changed_dirs.txt); do
        if [ -d "$dir" ]; then
          echo "Scanning $dir..."
          checkov -d "/workspace/$dir" --config-file /workspace/.checkov.yaml
        fi
      done
    id: 'tf-security-scan'
    waitFor: ['tf-init']

  # Terraform Plan (Runs for changed directories)
  - name: 'hashicorp/terraform:latest'
    entrypoint: 'sh'
    args:
    - '-c'
    - |
      if [ "$_ACTION" = "plan" ] || [ "$_ACTION" = "apply" ]; then
        for dir in $(cat /workspace/changed_dirs.txt); do
          if [ -d "$dir" ]; then
            echo "Planning Terraform in $dir..."
            cd /workspace/"$dir"
            terraform plan -input=false -out=tfplan
            cd /workspace
          fi
        done
      fi
    id: 'tf-plan'
    waitFor: ['tf-security-scan']

  # Terraform Apply (Only runs if _ACTION=apply)
  - name: 'hashicorp/terraform:latest'
    entrypoint: 'sh'
    args: 
    - '-c'
    - |
      if [ "$_ACTION" = "apply" ]; then
        for dir in $(cat /workspace/changed_dirs.txt); do
          if [ -d "$dir" ]; then
            echo "Applying Terraform in $dir..."
            cd /workspace/"$dir"
            if [ -f "tfplan" ]; then
              terraform apply -auto-approve -input=false tfplan
            else
              echo "Error: tfplan missing in $dir"
              exit 1
            fi
            cd /workspace
          fi
        done
      else
        echo "Action is not apply, skipping terraform apply."
      fi
    id: 'tf-apply'
    waitFor: ['tf-plan']

  # Record the commit this pipeline successfully applied, so the next push
  # build's changed-file diff starts from here rather than just ~1. Only
  # runs after a real apply - a plan-only build must not move the marker,
  # since nothing was actually made to match that commit's Terraform.
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'sh'
    args:
    - '-c'
    - |
      if [ "$_ACTION" = "apply" ]; then
        echo "$COMMIT_SHA" | gsutil cp - "gs://$_STATE_BUCKET/ci/last-applied-commit.txt"
      fi
    id: 'record-marker'
    waitFor: ['tf-apply']

substitutions:
  _ACTION: "plan"      # Defaults to plan, overridden to 'apply' in push-to-main trigger
  _BASE_BRANCH: ""     # Used for PRs
  _HEAD_BRANCH: ""     # Used for PRs
  _STATE_BUCKET: "core-infra-seed-8274-tf-state"  # bucket holding the ci/ marker object

options:
  logging: CLOUD_LOGGING_ONLY